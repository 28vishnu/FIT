<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fitness Tracker</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--mu:#85858a;--bd:rgba(60,60,67,.16);--g:255,255,255;--rim:rgba(255,255,255,.65);--ac:#ff453a;--bl:24px;--ga:.62;--sat:180%;--r:20px;--ts:1;--s:0;--sp:cubic-bezier(.32,.72,0,1);color-scheme:light}

:root[data-theme=dark]{--bg:#121214;--card:#222225;--tx:#fff;--mu:#98989f;--bd:rgba(84,84,88,.5);--g:44,44,48;--rim:rgba(255,255,255,.14);color-scheme:dark}
:root[data-theme=black]{--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#98989f;--bd:rgba(84,84,88,.5);--g:38,38,42;--rim:rgba(255,255,255,.14);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(15px*var(--ts))}

.mu{color:var(--mu);font-size:.82rem}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0}
button,input,select{font:inherit;color:inherit}
button{background:rgba(120,120,128,.2);border:0;border-radius:22px;padding:8px 15px;cursor:pointer;font-weight:600;transition:transform .25s var(--sp),opacity .2s}

.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.75;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.55));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.round{position:absolute;top:calc(8px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;color:var(--tx);font-weight:700}
#back{left:16px}#prof{right:16px}
.dock{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),520px);z-index:5}
.pw{display:grid;grid-template-rows:1fr;margin-bottom:8px;transition:transform .4s var(--sp),opacity .25s;will-change:transform,opacity}
.pw>div{min-height:0;overflow:hidden;padding:2px}
.dock.min .pw{transform:translateY(40%) scale(.92);opacity:0;pointer-events:none}
.pill{pointer-events:auto;border-radius:32px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.art{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tx{flex:1;min-width:0;white-space:nowrap}.tx div{overflow:hidden;text-overflow:ellipsis}

.tabs.hold .lens{--sc:1.16;transition:background .3s,box-shadow .3s,transform .55s var(--sp) 0s;background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(var(--g),.7));box-shadow:0 8px 28px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.8),inset 0 -1px 2px rgba(255,255,255,.25)}
.tabs.drag .lens{transition:background .3s,box-shadow .3s}
.tabs button{flex:1;position:relative;z-index:1;background:none;border-radius:30px;color:var(--mu);font-size:.69rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;transition:color .2s}

.tabs span{max-height:14px;overflow:hidden;transition:opacity .2s}
.dock.min .tabs span,.dock.nl .tabs span{max-height:0;opacity:0}
.dock.min .tabs button,.dock.nl .tabs button{padding:11px 0;gap:0}
.row{display:flex;gap:12px;align-items:flex-start}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:6px;background:rgba(120,120,128,.2);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);transition:width .6s var(--sp)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ac);background:none;flex:none;padding:0;color:#fff;display:flex;align-items:center;justify-content:center}.chk.on{background:var(--ac)}.chk svg{width:16px;height:16px;stroke-width:3}
.done .t{text-decoration:line-through;color:var(--mu)}.t{font-weight:600}.time{color:var(--ac);font-size:.82rem;font-weight:600}
summary{color:var(--mu);font-size:.82rem;cursor:pointer;margin-top:4px}details p{font-size:.88rem;margin:6px 0}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;scroll-snap-type:x mandatory}
.tile{flex:0 0 46%;aspect-ratio:1;scroll-snap-align:start;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;cursor:pointer}
.tile b{font-size:1rem;line-height:1.15}.tile small{opacity:.85}
.list{background:var(--card);border-radius:var(--r);margin:12px 0;padding:0 14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-bottom:.5px solid var(--bd);cursor:pointer}.li:last-child{border:0}
.ti{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}.ti svg{width:18px;height:18px}
.li .g{flex:1;min-width:0}.li input:not([type=checkbox]):not([type=range]),.li select{width:140px;text-align:right}
.sr{display:flex;align-items:center;gap:8px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:20px;background:rgba(120,120,128,.32);position:relative;flex:none;padding:0;cursor:pointer;transition:background .3s}
input[type=checkbox]:after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--sp)}
input[type=checkbox]:checked{background:#34c759}input[type=checkbox]:checked:after{transform:translateX(20px)}
.stat{display:flex;gap:8px;text-align:center}.stat div{flex:1}.stat b{display:block;font-size:1.2rem;color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{font-size:.82rem;padding:5px 12px}.chips button.on{background:var(--ac);color:#fff}
.seg{display:flex;background:rgba(120,120,128,.16);border-radius:10px;padding:2px;margin:10px 0}.seg button{flex:1;background:none;border-radius:8px;padding:6px 0;font-size:.85rem}.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.sw button{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px transparent}.sw button.on{box-shadow:0 0 0 2px var(--tx)}
.sw input{width:34px;height:34px;padding:0;border-radius:50%;background:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cell{aspect-ratio:1;padding:0;border-radius:50%;background:none;font-weight:400;border:2px solid transparent}.cell.td{border-color:var(--ac)}.cell.off{opacity:.35}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:40px}
#modal>div{max-width:300px;width:100%;border-radius:26px;text-align:center;overflow:hidden;animation:pop .4s var(--sp)}
#modal h3{margin:20px 16px 6px}#modal p{margin:0 18px 18px;font-size:.88rem}#modal button{display:block;width:100%;background:none;border-top:.5px solid var(--bd);border-radius:0;padding:14px}
@keyframes pop{from{opacity:0;transform:scale(1.12)}}@keyframes dn{from{opacity:0;transform:translateY(-30px) scale(.96)}}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:520px;margin:auto;z-index:11;border-radius:24px;padding:14px 18px;display:none;white-space:pre-line;animation:dn .5s var(--sp)}
.qh{margin-top:34px}
html{scrollbar-width:none;overscroll-behavior-y:none}::-webkit-scrollbar{display:none;width:0;height:0}
.lens{will-change:transform}
.qw{overflow:hidden}.glass{transition:backdrop-filter .35s,-webkit-backdrop-filter .35s}.tabs.glass,.pill.glass{transition:backdrop-filter .35s,-webkit-backdrop-filter .35s}
.qs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.q{flex:0 0 calc(100% - 28px);margin:14px;min-height:230px;scroll-snap-align:center;scroll-snap-stop:always;border-radius:26px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.q p{font-size:1.15rem;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin:0 0 16px}.q span{font-size:.82rem;opacity:.75}
.rm *{transition-duration:.01s!important;animation:none!important}
</style></head><body>
<div id="toast" class="glass" onclick="this.style.display='none'"></div>
<div id="top"><div id="tbg" class="glass"></div><div id="nt"></div>
<button id="back" class="round glass" onclick="back()" aria-label="Back"></button>
<button id="prof" class="round glass" onclick="open_('me')" aria-label="Profile"></button></div>
<main id="app"></main>
<div class="dock" id="dock"><div class="pw"><div><div class="pill glass" id="pill"></div></div></div>
<nav class="tabs glass" id="tabs"><div class="lens"></div></nav></div>
<div id="modal"></div>
<script>
"use strict";
const T=[
["wake","07:00","Wake and hydrate","Drink 500 ml water straight away and keep the phone down."],
["skam","07:10","Morning skincare","Rinse, moisturizer on damp skin, then sunscreen on face, ears and neck."],
["b","07:30","Breakfast","60 g oats in 250 ml full-cream milk, 2 eggs, 1 banana and 2 dates."],
["post","11:00","Posture check","Chin slightly tucked, ears over shoulders, shoulders relaxed."],
["l","13:00","Lunch","2 cups rice, dal or soya chunks curry, vegetables, 1 tsp ghee."],
["pre","16:30","Pre-workout snack","150 g curd, 30 g roasted peanuts, 2 dates."],
["wk","17:15","Home workout","Open Train and log every set."],
["sh","18:30","Post-workout shower","Salicylic body wash Mon, Tue, Thu, Fri; gentle soap other days. Lotion on damp skin."],
["d","20:30","Dinner","Rice or rotis, soya chunks curry or eggs or paneer, plus vegetables."],
["sw","21:00","Zero sweets check","No bakery items, sugary drinks or mithai today."],
["skpm","22:15","Night skincare","Face wash 30 s, pat dry, serum, moisturizer."],
["sl","22:30","Screens off and sleep","Sleep 7.5 to 8 hours."]];
const M={b:[["Standard",695,30,96,23]],l:[["Dal",775,26,140,11],["Soya",830,36,125,9]],pre:[["Standard",325,14,28,19]],d:[["Soya",620,36,108,7],["Eggs / paneer",570,24,92,12]]};
const W={1:["Push",["Decline push-ups|4x10-15","Regular push-ups|3x12-15","Lateral raises|4x15-20","Seated shoulder press|3x12-15","Chair dips|3x10-15"]],
2:["Pull",["Inverted rows / pull-ups|4x8-12","Single-arm rows|4x15/arm","Rear delt flyes|4x15-20","Hammer curls|3x12-15","Superman holds|3x30s"]],
3:["Legs and Core",["Bulgarian split squats|4x10-12/leg","Goblet squats|4x15-20","Single-leg RDLs|3x12/leg","Calf raises|4x15-20/leg","Plank + leg raises|3 rounds"]],
0:["Rest and Posture",["Chest doorway stretch|5 min","Thoracic extensions|5 min","Chin tucks|5 min"]]};
W[4]=W[1];W[5]=W[2];W[6]=W[3];
const P_={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',dumb:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',chart:'<path d="M4 20V10M12 20V4M20 20v-7"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',back:'<path d="M15 5l-7 7 7 7"/>',check:'<path d="M5 12l5 5 9-10"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',drop:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>',stop:'<path d="M7 7h10v10H7z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',look:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/>',data:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 2 4 3 8 3s8-1 8-3V6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24">${P_[n]}</svg>`;

let S={};try{S=JSON.parse(localStorage.getItem("rt"))||{}}catch(e){}
function init(){for(const k of ["done","water","ex","log","vr","w","steps","sleep","waist","foods","fired","sessions"])S[k]=S[k]||{};
S.me=Object.assign({name:"",age:"",height:""},S.me);
S.set=Object.assign({theme:"system",accent:"#ff453a",glass:true,blur:24,ga:62,sat:180,radius:20,ts:100,labels:true,collapse:true,reduce:false,remind:false,sound:true,start:ds(new Date()),motiv:true,mtime:"09:00",etime:"20:00",autoq:true,water:3500,kcal:2415,protein:106,steps:8000,sleep:8,rest:60},S.set);
if(!["system","light","dark","black"].includes(S.set.theme))S.set.theme="system";
S.set.rem=S.set.rem||{};S.set.times=S.set.times||{}}
function save(){try{localStorage.setItem("rt",JSON.stringify(S))}catch(e){toast("Could not save. Storage is full or blocked.")}sync()}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const a=s.split("-");return new Date(+a[0],a[1]-1,+a[2])};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date());
const time=id=>S.set.times[id]||T.find(t=>t[0]===id)[1];
const h12=t=>{const [h,m]=t.split(":").map(Number);return (h%12||12)+":"+pad(m)+(h<12?" AM":" PM")};
const sorted=()=>[...T].sort((a,b)=>time(a[0]).localeCompare(time(b[0])));
const dayNo=s=>Math.round((pd(s)-pd(S.set.start))/864e5)+1;
const fmt=(s,o)=>pd(s).toLocaleDateString(undefined,o||{weekday:"long",day:"numeric",month:"short"});
init();
let cur=today(),lastDay=cur,tb=0,page=null,cm=cur.slice(0,7)+"-01";
function mac(s){const r=[0,0],d=S.done[s]||{};for(const id in M)if(d[id]){const v=M[id][(S.vr[s]||{})[id]||0];r[0]+=v[1];r[1]+=v[2]}for(const f of S.foods[s]||[]){r[0]+=f.k;r[1]+=f.p}return r}
function pct(s){const d=S.done[s]||{};return (T.filter(t=>d[t[0]]).length+((S.water[s]||0)>=S.set.water?1:0))/(T.length+1)}
function streak(){let n=0;for(let k=0;k<365;k++){if(pct(add(today(),-k))>=.8)n++;else if(k)break}return n}

/* Look and feel */
const ACC=["#ff453a","#ff9f0a","#30d158","#0a84ff","#bf5af2","#ff375f","#64d2ff"];
function applyLook(){const s=S.set,r=document.documentElement,st=r.style;
s.theme==="system"?r.removeAttribute("data-theme"):r.dataset.theme=s.theme;
st.setProperty("--ac",s.accent);st.setProperty("--bl",s.glass?s.blur+"px":"0px");st.setProperty("--ga",s.glass?s.ga/100:1);st.setProperty("--sat",s.sat+"%");st.setProperty("--r",s.radius+"px");st.setProperty("--ts",s.ts/100);
r.classList.toggle("rm",!!s.reduce);$("dock").classList.toggle("nl",!s.labels)}
function lk(k,v,el){S.set[k]=+v;applyLook();el.nextElementSibling.textContent=v+el.dataset.u}

/* Navigation */
const NAMES=["Today","Plan","Train","Progress"],ICN=["home","list","dumb","chart"],TITLES={me:"Profile",set:"Settings",rem:"Reminders",goals:"Goals",look:"Appearance",data:"Your data",about:"About"};
function anim(){if(!S.set.reduce)$("app").animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:380,easing:"cubic-bezier(.32,.72,0,1)"})}
let hist=[];
function show(){render();scrollTo(0,0);anim()}
function tab(i){tb=i;page=null;hist=[];show()}
function open_(p){hist.push(page);page=p;show()}
function back(){page=hist.pop()||null;show()}
let ly=0,tk=0;addEventListener("scroll",()=>{if(tk)return;tk=1;requestAnimationFrame(()=>{tk=0;const y=Math.max(0,scrollY);const v=Math.min(1,Math.max(0,(y-22)/38)).toFixed(2),tp=$("top");if(tp.dataset.s!==v){tp.dataset.s=v;tp.style.setProperty("--s",v)}
if(S.set.collapse){if(y<20)$("dock").classList.remove("min");else if(Math.abs(y-ly)>8)$("dock").classList.toggle("min",y>ly);}else $("dock").classList.remove("min");ly=y})},{passive:true});
/* Dock: tap, or press and drag the lens across tabs */
(function(){const el=$("tabs");el.insertAdjacentHTML("beforeend",NAMES.map((n,i)=>`<button data-i="${i}">${I(ICN[i])}<span>${n}</span></button>`).join(""));
let down=false,x0=0,moved=false;
const idx=e=>{const b=el.getBoundingClientRect(),w=(b.width-10)/4;return Math.min(3,Math.max(0,(e.clientX-b.left-5)/w-.5))};
const mark=f=>[...el.querySelectorAll("button")].forEach((b,i)=>b.classList.toggle("on",i===Math.round(f)));
el.addEventListener("pointerdown",e=>{down=true;moved=false;x0=e.clientX;el.setPointerCapture(e.pointerId);el.classList.add("hold");const f=idx(e);el.style.setProperty("--i",f);mark(f)});
el.addEventListener("pointermove",e=>{if(!down)return;if(Math.abs(e.clientX-x0)>6)moved=true;if(moved){el.classList.add("drag");const f=idx(e);el.style.setProperty("--i",f);mark(f)}});
const end=e=>{if(!down)return;down=false;const f=Math.round(idx(e));el.classList.remove("hold","drag");el.style.setProperty("--i",f);tab(f)};
el.addEventListener("pointerup",end);el.addEventListener("pointercancel",()=>{down=false;el.classList.remove("hold","drag");render()})})();

/* Actions */
